    post:
      tags: [admin-vaults]
      summary: "Reset a per-vault repair watermark (0x2B evolve entity-link repair, 0x2E full-weight association repair, or both) so the next boot re-scans."
      description: "Node-local: neither repair pass is leader-gated or replicated (each cluster node runs its own startup pass), so this resets THIS node's own watermark only."
      security:
        - AdminSession: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
