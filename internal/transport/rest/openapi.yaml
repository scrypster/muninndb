openapi: "3.0.3"
info:
  title: MuninnDB API
  version: "0.2.6"
  description: "Cognitive memory engine with associative recall, Hebbian reinforcement, and semantic search."
  license:
    name: BSL 1.1

servers:
  - url: http://localhost:8475

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API key issued via POST /api/admin/keys. Pass as Authorization: Bearer <token>."
    AdminSession:
      type: apiKey
      in: cookie
      name: muninn_session
      description: "Cookie-based admin session for /api/admin/* endpoints."
    ClusterToken:
      type: http
      scheme: bearer
      description: "Bearer token for /v1/cluster/* and /v1/replication/* endpoints."

  schemas:

    WorkerStats:
      type: object
      required: [processed, batches, errors, dropped, lastRun, state, status, enabled, effectiveWait]
      properties:
        processed:
          type: integer
          format: uint64
        batches:
          type: integer
          format: uint64
        errors:
          type: integer
          format: uint64
        dropped:
          type: integer
          format: uint64
        lastRun:
          type: integer
          format: int64
          description: "Unix timestamp in nanoseconds; zero means never."
        state:
          type: integer
          format: int32
          description: "Legacy numeric lifecycle state. Zero is ambiguous between active and disabled. Check enabled first, then prefer status."
        status:
          type: string
          description: "Stable symbolic lifecycle state. Unknown future states are reported as unknown."
          enum: [active, idle, dormant, stopped, disabled, unknown]
        enabled:
          type: boolean
          description: "Whether the worker is configured on this node. Dormant workers remain enabled."
        effectiveWait:
          type: integer
          format: int64
          description: "Current worker wait interval in nanoseconds."

    EngineWorkerStats:
      type: object
      required: [hebbian, contradict, confidence]
      properties:
        hebbian:
          $ref: "#/components/schemas/WorkerStats"
        contradict:
          $ref: "#/components/schemas/WorkerStats"
        confidence:
          $ref: "#/components/schemas/WorkerStats"

    # ── Core write/read ─────────────────────────────────────────────────────

    WriteRequest:
      type: object
      required: [concept, content]
      properties:
        concept:
          type: string
          description: "Short label / title for the engram."
        content:
          type: string
          description: "Full textual content to store."
        tags:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: float
          default: 0
        stability:
          type: number
          format: float
          default: 0
        importance:
          type: number
          format: float
          nullable: true
          description: "Caller-asserted priority in [0,1]; omitted = unset (a use-time default derives from memory_type). Explicit 0 is stored as 0.01."
        created_at:
          type: string
          format: date-time
          nullable: true
        vault:
          type: string
          default: "default"
        idempotent_id:
          type: string
          description: "Caller-assigned deduplication key."
        memory_type:
          type: integer
          format: uint8
        type_label:
          type: string
        trust:
          type: string
          enum: [verified, inferred, external, untrusted]
          description: "Provenance trust level. Default 'inferred'. 'verified' requires a full or write credential (observe is rejected)."
        summary:
          type: string
          description: "Pre-computed summary (bypasses background enrichment)."
        entities:
          type: array
          items:
            $ref: "#/components/schemas/InlineEntity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/InlineRelationship"

    InlineEntity:
      type: object
      properties:
        name:
          type: string
        type:
          type: string

    InlineRelationship:
      type: object
      properties:
        target_id:
          type: string
        relation:
          type: string
        weight:
          type: number
          format: float

    WriteResponse:
      type: object
      properties:
        id:
          type: string
          description: "ULID assigned to the new engram."
        created_at:
          type: integer
          format: int64
          description: "Unix timestamp (nanoseconds)."

    BatchWriteRequest:
      type: array
      items:
        $ref: "#/components/schemas/WriteRequest"

    BatchWriteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/WriteResponse"
        errors:
          type: array
          items:
            type: string
            nullable: true

    ReadResponse:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        content:
          type: string
        confidence:
          type: number
          format: float
        relevance:
          type: number
          format: float
        stability:
          type: number
          format: float
        importance:
          type: number
          format: float
          description: "Stored caller-asserted importance; 0 = unset (effective value is derived at read time from memory_type/trust)."
        access_count:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        state:
          type: integer
          format: uint8
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        last_access:
          type: integer
          format: int64
        summary:
          type: string
        key_points:
          type: array
          items:
            type: string
        memory_type:
          type: integer
          format: uint8
        type_label:
          type: string
        trust:
          type: string
          enum: [verified, inferred, external, untrusted]
          description: "Provenance trust level. Default 'inferred'. 'verified' requires a full or write credential."
        classification:
          type: integer
          format: int32

    # ── Activate ─────────────────────────────────────────────────────────────

    Weights:
      type: object
      properties:
        semantic_similarity:
          type: number
          format: float
        full_text_relevance:
          type: number
          format: float
        decay_factor:
          type: number
          format: float
        hebbian_boost:
          type: number
          format: float
        access_frequency:
          type: number
          format: float
        recency:
          type: number
          format: float
        use_cgdn:
          type: boolean
        cgdn_alpha:
          type: number
          format: float
        cgdn_beta:
          type: number
          format: float
        cgdn_power:
          type: number
          format: float
        use_actr:
          type: boolean
        actr_decay:
          type: number
          format: float
        actr_heb_scale:
          type: number
          format: float
        disable_actr:
          type: boolean

    Filter:
      type: object
      properties:
        field:
          type: string
        op:
          type: string
        value: {}

    ActivateRequest:
      type: object
      required: [context]
      properties:
        context:
          type: array
          items:
            type: string
          description: "Query terms / phrases for semantic recall."
        threshold:
          type: number
          format: float
          description: "Minimum relevance score 0.0-1.0. Omitted/0 resolves to a mode-aware default: ~0.1 for the normal (ACT-R) scoring vault, or a near-zero rank-based floor (~0.001) for a vault configured with scoring_fusion='rrf' — RRF scores rarely exceed ~0.15, so an explicit threshold above ~0.01 there can filter out everything. An explicit non-zero value is never modified."
        max_results:
          type: integer
          default: 10
        max_hops:
          type: integer
          default: 0
        include_why:
          type: boolean
        read_only:
          type: boolean
          description: "When true, suppress reinforcement side effects (TouchAccess and implicit feedback) for this recall. Always effectively true for observe-mode credentials."
        weights:
          $ref: "#/components/schemas/Weights"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        vault:
          type: string
          default: "default"
        brief_mode:
          type: string
          enum: ["", "extractive", "llm", "auto"]
          default: "auto"
        disable_hops:
          type: boolean
        profile:
          type: string
          enum: ["", "default", "causal", "confirmatory", "adversarial", "structural"]
        mode:
          type: string
          enum: ["", "semantic", "recent", "balanced", "deep"]

    ScoreComponents:
      type: object
      properties:
        semantic_similarity:
          type: number
          format: float
          description: COG-26 baseline-calibrated cosine (semCal), not the raw one.
        semantic_similarity_raw:
          type: number
          format: float
          description: >-
            The UNCALIBRATED cosine behind semantic_similarity — COG-26's
            honesty backstop, so an operator can see the raw signal behind a
            match a low calibrated value made look weak.
        full_text_relevance:
          type: number
          format: float
        content_match:
          type: number
          format: float
          description: >-
            w_sem*semCal + w_fts*fts_coverage in [0,1], BEFORE the ACT-R
            contextual prior, before per-query normalization and before
            confidence. The only reported number that answers "is this memory
            about the query" on a scale comparable ACROSS queries, and the
            quantity the relevance calibration is stated on.
        absolute_score:
          type: number
          format: float
          description: >-
            Raw BEFORE the per-query 1/maxRaw rescale, clamped to [0,1] and
            multiplied by confidence. Unlike `score` it is not relative to this
            query's candidate set, so 0.9 means the same thing on a good query
            and a garbage one. This is the quantity the abstention gate compares
            and the quantity relevance_band is derived from.
        decay_factor:
          type: number
          format: float
        hebbian_boost:
          type: number
          format: float
        transition_boost:
          type: number
          format: float
        entity_boost:
          type: number
          format: float
        access_frequency:
          type: number
          format: float
        recency:
          type: number
          format: float
        raw:
          type: number
          format: float
        final:
          type: number
          format: float

    ActivationItem:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        content:
          type: string
        summary:
          type: string
        score:
          type: number
          format: float
          description: >-
            RELATIVE to this query's own best candidate: the 1/maxRaw rescale
            pins the argmax of ANY query near the top of the range, including a
            query this vault cannot answer. It ORDERS results. Judge relevance
            by relevance_band (or score_components.absolute_score), never by
            this.
        confidence:
          type: number
          format: float
          description: >-
            The stored TRUTH-belief for this memory (COG-10) — moved by
            contradiction and explicit feedback, never by retrieval. NOT a
            retrieval statistic: a memory can be a certain fact and a terrible
            match (confidence 1, relevance_band weak).
        relevance_band:
          type: string
          enum: [strong, moderate, weak, filter_match, uncalibrated]
          description: >-
            #773 score-presentation honesty. The ABSOLUTE relevance band for
            this row, derived from score_components.absolute_score against THIS
            VAULT's own calibration — its resolved default gate (which COG-26
            deliberately placed just above the embed model's measured
            out-of-domain noise ceiling) and its resolved content-channel
            ceiling. strong = at or above half the ceiling (near-verbatim
            evidence); moderate = clear of the noise band; weak = within one
            doubling of the noise floor, i.e. a NEIGHBOUR rather than
            necessarily an ANSWER; filter_match = admitted below the relevance
            bar by an explicit tag filter (COG-5 S1) — the filter defined the
            set, not relevance; uncalibrated = this row's absolute score is not
            on a bandable scale, with relevance_band_basis naming why.
            NOTE the separate `relevance` field below is a different quantity
            entirely (the engram's stored decay/pruning strength).
        relevance_band_basis:
          type: string
          enum:
            [
              tag_filter_bypass,
              rrf_fusion,
              weighted_sum_fusion,
              no_model_baseline,
              semantic_floor_disabled,
              semantic_degraded,
              no_content_channel,
              no_calibration_gate,
              not_scored,
            ]
          description: >-
            Set only for filter_match and uncalibrated, and names WHY. rrf /
            weighted_sum: those fusion modes do not gate on absolute_score and
            have no comparable calibration. no_model_baseline: COG-26 gave this
            embed model the identity transform, so semantic similarity is raw
            cosine whose noise floor is ~0.45 — every band would be wrong.
            semantic_floor_disabled: the same identity transform, but because
            the vault's operator explicitly set semantic_floor: 0 (the
            documented way to disable the floor) — a choice, not a missing
            calibration.
            semantic_degraded: the semantic weight was redistributed onto the
            lexical channel and the ceiling shifted. not_scored: the row was
            injected by a post-pipeline phase (entity-boost spread activation,
            supersession head promotion) and its aboutness against this query
            was never MEASURED — which is different from measured and low.
        score_components:
          $ref: "#/components/schemas/ScoreComponents"
        why:
          type: string
        hop_path:
          type: array
          items:
            type: string
        dormant:
          type: boolean
        created_at:
          type: integer
          format: int64
        last_access:
          type: integer
          format: int64
        access_count:
          type: integer
          format: int64
        relevance:
          type: number
          format: float
        source_type:
          type: string
        state:
          type: integer
          format: uint8
        trust:
          type: integer
          format: uint8
        memory_type:
          type: integer
          format: uint8
        type_label:
          type: string
        tags:
          type: array
          items:
            type: string
          description: "The engram's tags (S4), so callers can filter low-salience entries client-side."
        superseded_by:
          type: string
          description: >-
            ASSERTED (declared RelSupersedes chain): the immediate superseder's ULID.
            Present whenever this result is superseded. See COG-22.
        current_version:
          type: string
          description: >-
            ASSERTED: the chain head — the fact to consult now. Present whenever this
            result is superseded.
        substituted_for:
          type: string
          description: >-
            ASSERTED (COG-28): the superseded PREDECESSOR whose match admitted or boosted
            this row. Your query's wording reached the older version and recall resolved it
            to this current one. On an injected row (own wording did not match) both score
            and score_components are the predecessor's measurements; on a raised row (own
            wording matched, predecessor matched harder) only score is the predecessor's —
            score_components remain this memory's own. substitution_basis carries the
            predecessor's measurements in both cases.
        substitution_basis:
          $ref: "#/components/schemas/SubstitutionBasis"
        chain_truncated:
          type: boolean
          description: >-
            COG-28: the declared version chain was longer than the walk limit, so the
            returned memory may not be the very latest version.
        head_not_indexed_yet:
          type: boolean
          description: >-
            COG-28: this memory has no stored embedding yet (indexing pending). "Not
            indexed", not "not relevant".
        possibly_superseded_by:
          type: string
          description: >-
            ADVISORY heuristic currency (COG-25) — INFERRED from a same-version cluster,
            never asserted. Verify before treating this memory as false; it is still
            returned at full score.
        version_cluster:
          type: string
          description: "ADVISORY (COG-25): stable key shared by detected cluster members."
        newest_of_cluster:
          type: boolean
          description: "ADVISORY (COG-25): newest among the RETURNED cluster members."
        cluster_size:
          type: integer
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
        expired:
          type: boolean
        importance:
          type: number
          format: float
        unresolved_contradiction:
          $ref: "#/components/schemas/ContradictionConflict"

    ContradictionConflict:
      type: object
      description: >-
        COG-29 contradiction honesty (#764). ASSERTED, from a declared
        `contradicts` link that nothing has resolved: this memory is declared to
        disagree with another one, so it must NOT be read as the answer without
        checking this annotation. Its score has been demoted 10 percent below
        its earned value; results stay ordered by score, so near-tied rivals
        land adjacent while a clearly stronger match keeps its rank. Resolve it
        with evolve, forget(not_true_since=…), or link(relation="supersedes").
        Absent when the memory is in no live conflict.
      properties:
        with:
          type: string
          description: The partner memory's ULID.
        with_concept:
          type: string
          description: The partner's concept. Omitted when it could not be resolved (never guessed at).
        side:
          type: string
          enum: [asserted, challenged]
          description: >-
            "asserted" when this memory is the SOURCE of the contradicts edge,
            "challenged" when it is the target.
        declared_at:
          type: string
          format: date-time
          description: When the edge was written. OMITTED when unknown — never serialised as the zero instant.
        partner_in_results:
          type: boolean
          description: >-
            Whether the partner is also in this response. When false the partner
            is NAMED but deliberately not injected — neither side of an
            unresolved conflict is known to be right, so a conflict must never
            lift content into a result set it did not earn.
        cluster_size:
          type: integer
        cluster_truncated:
          type: boolean

    ConflictBlock:
      type: object
      description: >-
        COG-29 (#764) response-level signal: at least two returned memories are
        declared to contradict each other and the conflict is unresolved, so
        NEITHER is presented as the answer. `abstained` is deliberately NOT set
        alongside it — the candidates are admission-worthy and the response is
        non-empty.
      properties:
        unresolved:
          type: boolean
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ConflictPairInfo"
        warning:
          type: string
        adjacency_overflow:
          type: integer
          description: >-
            How many rows beyond max_results this response carries in order to
            keep a conflict cluster whole. Never applied silently.

    ConflictPairInfo:
      type: object
      properties:
        a:
          type: string
        b:
          type: string
        a_concept:
          type: string
        b_concept:
          type: string
        declared_at:
          type: string
          format: date-time
        preferred:
          type: string
          enum: [a, b]
          description: >-
            The side the recency ladder prefers (valid-time, then the direction
            of the declaration) — NOT a verdict about which memory is true, and
            it may differ from the response's actual order, which is by demoted
            score.
        basis:
          type: string
          enum: [newer_valid_from, asserting_side, ulid_tiebreak]
        partner_in_results:
          type: boolean

    SubstitutionBasis:
      type: object
      description: >-
        COG-28: the superseded predecessor's measured evidence against this query — what
        admitted a substituted row. absolute_score is the exact quantity that was compared
        against the recall threshold, so a caller can verify for itself that the
        substitution redirected admission-worthy evidence rather than manufacturing it.
      properties:
        absolute_score:
          type: number
          format: float
        content_match:
          type: number
          format: float
        semantic_similarity:
          type: number
          format: float
        full_text_relevance:
          type: number
          format: float

    BriefSentence:
      type: object
      properties:
        engram_id:
          type: string
        text:
          type: string
        score:
          type: number
          format: double

    ActivateResponse:
      type: object
      properties:
        query_id:
          type: string
        total_found:
          type: integer
        activations:
          type: array
          items:
            $ref: "#/components/schemas/ActivationItem"
        latency_ms:
          type: number
          format: double
        frame:
          type: integer
        total_frames:
          type: integer
        brief:
          type: array
          items:
            $ref: "#/components/schemas/BriefSentence"
        semantic_degraded:
          type: boolean
          description: >-
            True when semantic (vector) scoring degraded during this recall — the
            embed backend was unreachable, returned an empty/all-zero query vector,
            or a post-load embedding fetch failed — so semantic_similarity may be
            understated. Query-granular and coarse (set on any such failure even if
            the primary vector search produced real scores). Omitted when false.
        abstained:
          type: boolean
          description: >-
            True when the pipeline ran to completion and DELIBERATELY returned
            nothing: candidates were scored and every one fell below the
            relevance bar or was filtered. Empty iff abstained is false.
        abstained_reason:
          type: string
          enum: [no_candidates, below_threshold, filtered, superseded_only, ambiguous_version]
        conflict:
          $ref: "#/components/schemas/ConflictBlock"

    # ── Link ─────────────────────────────────────────────────────────────────

    LinkRequest:
      type: object
      required: [source_id, target_id, rel_type]
      properties:
        source_id:
          type: string
        target_id:
          type: string
        rel_type:
          type: integer
          format: int32
        weight:
          type: number
          format: float
        vault:
          type: string
          default: "default"

    LinkResponse:
      type: object
      properties:
        ok:
          type: boolean

    # ── Forget ───────────────────────────────────────────────────────────────

    ForgetResponse:
      type: object
      properties:
        ok:
          type: boolean

    # ── Stats ────────────────────────────────────────────────────────────────

    CoherenceResult:
      type: object
      properties:
        score:
          type: number
          format: double
        orphan_ratio:
          type: number
          format: double
        contradiction_density:
          type: number
          format: double
        duplication_pressure:
          type: number
          format: double
        temporal_variance:
          type: number
          format: double
        total_engrams:
          type: integer
          format: int64

    StatResponse:
      type: object
      properties:
        engramCount:
          type: integer
          format: int64
        vaultCount:
          type: integer
        indexSize:
          type: integer
          format: int64
        storageBytes:
          type: integer
          format: int64
        coherence:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CoherenceResult"

    # ── Health / Ready ───────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        db_writable:
          type: boolean

    ReadyResponse:
      type: object
      properties:
        status:
          type: string

    # ── List engrams ─────────────────────────────────────────────────────────

    EngramItem:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        content:
          type: string
        confidence:
          type: number
          format: float
        tags:
          type: array
          items:
            type: string
        vault:
          type: string
        createdAt:
          type: integer
          format: int64

    ListEngramsResponse:
      type: object
      properties:
        engrams:
          type: array
          items:
            $ref: "#/components/schemas/EngramItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Graph / Links ────────────────────────────────────────────────────────

    AssociationItem:
      type: object
      properties:
        targetId:
          type: string
        relType:
          type: integer
          format: int32
        weight:
          type: number
          format: float

    GetEngramLinksResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/AssociationItem"

    # ── Session ──────────────────────────────────────────────────────────────

    SessionItem:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        content:
          type: string
        createdAt:
          type: integer
          format: int64

    GetSessionResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # ── Cognitive operations ─────────────────────────────────────────────────

    EvolveRequest:
      type: object
      required: [new_content, reason]
      properties:
        new_content:
          type: string
        reason:
          type: string
        vault:
          type: string
          default: "default"

    EvolveResponse:
      type: object
      properties:
        id:
          type: string

    ConsolidateRequest:
      type: object
      required: [ids, merged_content]
      properties:
        vault:
          type: string
          default: "default"
        ids:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 50
        merged_content:
          type: string

    ConsolidateResponse:
      type: object
      properties:
        id:
          type: string
          description: "ID of the surviving engram."
        archived:
          type: array
          items:
            type: string
          description: "IDs of the archived source engrams."
        warnings:
          type: array
          items:
            type: string

    DecideRequest:
      type: object
      required: [decision, rationale]
      properties:
        vault:
          type: string
          default: "default"
        decision:
          type: string
        rationale:
          type: string
        alternatives:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string

    DecideResponse:
      type: object
      properties:
        id:
          type: string

    RestoreResponse:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        restored:
          type: boolean
        state:
          type: string

    TraverseRequest:
      type: object
      required: [start_id]
      properties:
        vault:
          type: string
          default: "default"
        start_id:
          type: string
        max_hops:
          type: integer
          default: 3
          minimum: 1
          maximum: 5
        max_nodes:
          type: integer
          default: 50
          maximum: 100
        rel_types:
          type: array
          items:
            type: string

    TraversalNode:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        hop_dist:
          type: integer
        summary:
          type: string

    TraversalEdge:
      type: object
      properties:
        from_id:
          type: string
        to_id:
          type: string
        rel_type:
          type: string
        weight:
          type: number
          format: float

    TraverseResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TraversalNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TraversalEdge"
        total_reachable:
          type: integer
        query_ms:
          type: number
          format: double

    ExplainRequest:
      type: object
      required: [engram_id]
      properties:
        vault:
          type: string
          default: "default"
        engram_id:
          type: string
        query:
          type: array
          items:
            type: string

    ExplainComponents:
      type: object
      properties:
        full_text_relevance:
          type: number
          format: double
        semantic_similarity:
          type: number
          format: double
        decay_factor:
          type: number
          format: double
        hebbian_boost:
          type: number
          format: double
        access_frequency:
          type: number
          format: double
        confidence:
          type: number
          format: double

    ExplainResponse:
      type: object
      properties:
        engram_id:
          type: string
        concept:
          type: string
        final_score:
          type: number
          format: double
        components:
          $ref: "#/components/schemas/ExplainComponents"
        fts_matches:
          type: array
          items:
            type: string
        assoc_path:
          type: array
          items:
            type: string
        would_return:
          type: boolean
        threshold:
          type: number
          format: double

    SetStateRequest:
      type: object
      required: [state]
      properties:
        vault:
          type: string
          default: "default"
        state:
          type: string
          enum: [planning, active, paused, blocked, completed, cancelled, archived]
        reason:
          type: string

    SetStateResponse:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        updated:
          type: boolean

    DeletedEngramItem:
      type: object
      properties:
        id:
          type: string
        concept:
          type: string
        deleted_at:
          type: integer
          format: int64
        recoverable_until:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string

    ListDeletedResponse:
      type: object
      properties:
        deleted:
          type: array
          items:
            $ref: "#/components/schemas/DeletedEngramItem"
        count:
          type: integer

    RetryEnrichResponse:
      type: object
      properties:
        engram_id:
          type: string
        plugins_queued:
          type: array
          items:
            type: string
        already_complete:
          type: array
          items:
            type: string
        note:
          type: string

    ContradictionItem:
      type: object
      properties:
        id_a:
          type: string
        concept_a:
          type: string
        id_b:
          type: string
        concept_b:
          type: string
        detected_at:
          type: integer
          format: int64

    ContradictionsResponse:
      type: object
      properties:
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/ContradictionItem"

    GuideResponse:
      type: object
      properties:
        guide:
          type: string

    # ── Error ────────────────────────────────────────────────────────────────

    ErrorDetail:
      type: object
      properties:
        code:
          oneOf:
            - type: integer
            - type: string
          description: "Machine-readable error code. Handler-level errors use numeric MBP codes; middleware and auth errors may use string codes."
        message:
          type: string
        request_id:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    # ── Admin — API keys ─────────────────────────────────────────────────────

    CreateAPIKeyRequest:
      type: object
      required: [vault]
      properties:
        vault:
          type: string
          default: "default"
        label:
          type: string
          maxLength: 256
        mode:
          type: string
          enum: ["full", "observe", "write", "append"]
          default: "full"

    APIKey:
      type: object
      properties:
        id:
          type: string
        vault:
          type: string
        label:
          type: string
        mode:
          type: string
        created_at:
          type: string
          format: date-time

    CreateAPIKeyResponse:
      type: object
      properties:
        token:
          type: string
          description: "Bearer token — shown only once."
        key:
          $ref: "#/components/schemas/APIKey"

    ListAPIKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"

    # ── Admin — vault config ─────────────────────────────────────────────────

    PlasticityConfig:
      type: object
      properties:
        version:
          type: integer
        preset:
          type: string
          enum: [default, reference, scratchpad, knowledge-graph, working]
        multi_user:
          type: boolean
          nullable: true
          description: >-
            Vault is shared by multiple users/agents — guidance surfaces
            (muninn_guide, recall hints) steer clients to per-user scoped
            recall instead of vault-global recency tools.
        hebbian_enabled:
          type: boolean
          nullable: true
          description: >
            Hebbian co-activation learning. Symmetric (COG-32): gates weight
            updates, association decay, and the read-side boost recall applies
            from association weights. false means recall is never scored by
            association weights.
        temporal_enabled:
          type: boolean
          nullable: true
        auto_link_neighbors:
          type: boolean
          nullable: true
        hop_depth:
          type: integer
          nullable: true
          minimum: 0
          maximum: 8
        semantic_weight:
          type: number
          format: float
          nullable: true
        fts_weight:
          type: number
          format: float
          nullable: true
        relevance_floor:
          type: number
          format: float
          nullable: true
        temporal_halflife:
          type: number
          format: float
          nullable: true
        assoc_decay_factor:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: >-
            Association-decay enable/disable switch. Any value > 0 enables edge
            decay; 0 disables it. It does not set a rate (#762) — the rate is
            assoc_half_life_days.
        assoc_min_weight:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        archive_threshold:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        max_engrams:
          type: integer
          nullable: true
          minimum: 0
        retention_days:
          type: number
          format: float
          nullable: true
          minimum: 0
        assoc_half_life_days:
          type: number
          format: float
          nullable: true
          description: >-
            Wall-clock half-life of an unused association edge, in days.
            Clamped to [0.5, 3650]; 0 or null means "use the preset value"
            (30 for default/reference/working, 90 for knowledge-graph).
        traversal_profile:
          type: string
          nullable: true
          enum: ["", default, causal, confirmatory, adversarial, structural]
        actr_decay:
          type: number
          format: double
          nullable: true
        actr_heb_scale:
          type: number
          format: double
          nullable: true
        experimental_cgdn:
          type: boolean
          nullable: true
        recall_mode:
          type: string
          nullable: true
          enum: ["", semantic, recent, balanced, deep]

    VaultConfig:
      type: object
      properties:
        name:
          type: string
        public:
          type: boolean
        plasticity:
          $ref: "#/components/schemas/PlasticityConfig"

    PlasticityResponse:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/PlasticityConfig"
        resolved:
          type: object
          description: "Fully resolved (preset + overrides applied) plasticity values."

    ChangeAdminPasswordRequest:
      type: object
      required: [new_password]
      properties:
        username:
          type: string
        new_password:
          type: string

    # ── Admin — embed / plugins ──────────────────────────────────────────────

    EmbedStatusResponse:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        enabled:
          type: boolean
        embedded_count:
          type: integer
          format: int64
        total_count:
          type: integer
          format: int64
        indexing:
          type: boolean

    PluginStatusResponse:
      type: object
      properties:
        name:
          type: string
        tier:
          type: integer
          description: "2=embed, 3=enrich"
        healthy:
          type: boolean
        last_check:
          type: string
          format: date-time
        error:
          type: string
        provider:
          type: string
        model:
          type: string

    MCPInfoResponse:
      type: object
      properties:
        url:
          type: string
        token_configured:
          type: boolean

    # ── Admin — vault operations ─────────────────────────────────────────────

    CloneVaultRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string

    MergeVaultRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
        delete_source:
          type: boolean
          default: false

    RenameVaultRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string

    JobResponse:
      type: object
      properties:
        job_id:
          type: string

    ReindexFTSResponse:
      type: object
      properties:
        vault:
          type: string
        engrams_reindexed:
          type: integer
          format: int64

    ReembedVaultRequest:
      type: object
      properties:
        model:
          type: string

    ResetRepairWatermarkRequest:
      type: object
      required: [which]
      properties:
        which:
          type: string
          enum: [evolve, assoc_weight, all]
          description: "Which repair watermark to reset: 0x2B (evolve entity-link repair), 0x2E (full-weight association repair), or both."

    ResetRepairWatermarkResponse:
      type: object
      properties:
        vault:
          type: string
        which:
          type: string

    # ── Admin — backup ───────────────────────────────────────────────────────

    BackupRequest:
      type: object
      required: [output_dir]
      properties:
        output_dir:
          type: string

    BackupResponse:
      type: object
      properties:
        output_dir:
          type: string
        size_bytes:
          type: integer
          format: int64
        elapsed:
          type: string

    # ── Admin — cluster ──────────────────────────────────────────────────────

    ClusterTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer

    EnableClusterRequest:
      type: object
      required: [role, bind_addr]
      properties:
        role:
          type: string
          enum: [primary, replica, sentinel, observer]
        bind_addr:
          type: string
        cluster_secret:
          type: string
        cortex_addr:
          type: string

    AddNodeRequest:
      type: object
      required: [addr]
      properties:
        addr:
          type: string
        token:
          type: string

    FailoverRequest:
      type: object
      required: [target_node_id]
      properties:
        target_node_id:
          type: string

    ClusterSettingsRequest:
      type: object
      properties:
        heartbeat_ms:
          type: integer
          nullable: true
        sdown_beats:
          type: integer
          nullable: true
        ccs_interval_seconds:
          type: integer
          nullable: true
        reconcile_on_heal:
          type: boolean
          nullable: true

    TestNodeRequest:
      type: object
      required: [addr]
      properties:
        addr:
          type: string

    TestNodeResponse:
      type: object
      properties:
        reachable:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error:
          type: string

    # ── Cluster (public v1) ──────────────────────────────────────────────────

    ClusterMemberInfo:
      type: object
      properties:
        node_id:
          type: string
        addr:
          type: string
        role:
          type: string
        last_seq:
          type: integer
          format: int64

    ClusterInfoResponse:
      type: object
      properties:
        node_id:
          type: string
        role:
          type: string
        is_leader:
          type: boolean
        epoch:
          type: integer
          format: int64
        fencing_token:
          type: integer
          format: int64
        cortex_id:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMemberInfo"

    ClusterHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        role:
          type: string
        is_leader:
          type: boolean
        epoch:
          type: integer
          format: int64
        replication_lag:
          type: integer
          format: int64

    ClusterNodesResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMemberInfo"
        count:
          type: integer

    CognitiveConsistencyResponse:
      type: object
      properties:
        score:
          type: number
          format: double
        assessment:
          type: string
        node_scores:
          type: object
          additionalProperties:
            type: number
            format: double
        sampled_at:
          type: string
          format: date-time

    # ── Replication ──────────────────────────────────────────────────────────

    NodeInfoResponse:
      type: object
      properties:
        node_id:
          type: string
        addr:
          type: string
        role:
          type: string
        last_seq:
          type: integer
          format: int64

    ReplicationStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
        role:
          type: string
        is_leader:
          type: boolean
        epoch:
          type: integer
          format: int64
        node_id:
          type: string
        known_nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeInfoResponse"

    ReplicationLagResponse:
      type: object
      properties:
        lag:
          type: integer
          format: int64
        role:
          type: string

    ReplicationPromoteResponse:
      type: object
      properties:
        triggered:
          type: boolean

    # ── Activity counts ─────────────────────────────────────────────────────

    ActivityCountItem:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          description: "UTC calendar date (YYYY-MM-DD)."
        count:
          type: integer
          format: int64
          minimum: 0
          description: "Number of engrams created on this day."

    ActivityCountsResponse:
      type: object
      required: [counts]
      properties:
        counts:
          type: array
          items:
            $ref: "#/components/schemas/ActivityCountItem"

  responses:
    BadRequest:
      description: "Invalid request body or parameters."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid authentication."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Authenticated but not permitted to perform the operation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotCortex:
      description: |
        This node is not the cluster's Cortex, and the operation writes.
        In cluster mode writes are accepted only on the Cortex; a write
        committed on a Lobe would never be replicated (#596). Retry against
        the node named in the response headers. Never returned by a
        standalone (non-cluster) server, and never for a read.
      headers:
        X-Muninn-Cortex-Id:
          description: "Node id of the Cortex to retry against. Absent if no Cortex is currently known (mid-election)."
          schema:
            type: string
        X-Muninn-Cortex-Addr:
          description: "Cluster address of the Cortex to retry against. Absent if unknown."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "Conflict with current state."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: "Internal server error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

tags:
  - name: health
    description: "Liveness and readiness probes."
  - name: engrams
    description: "Create, read, delete individual engrams."
  - name: recall
    description: "Associative recall and activation."
  - name: graph
    description: "Graph traversal and association links."
  - name: vault
    description: "Vault listing and session timeline."
  - name: cognitive
    description: "Higher-order cognitive operations (evolve, consolidate, decide, etc.)."
  - name: admin-keys
    description: "API key management (admin)."
  - name: admin-vaults
    description: "Vault lifecycle management (admin)."
  - name: admin-system
    description: "System-level admin operations (plugins, backup, observability)."
  - name: cluster
    description: "Cluster topology, replication, and admin cluster control."

paths:

  # ── OpenAPI spec ─────────────────────────────────────────────────────────

  /api/openapi.yaml:
    get:
      tags: [health]
      summary: "Serve this OpenAPI specification."
      security: []
      responses:
        "200":
          description: "OpenAPI 3.0 YAML document."
          content:
            application/yaml:
              schema:
                type: string

  # ── Health / diagnostics ─────────────────────────────────────────────────

  /api/health:
    get:
      tags: [health]
      summary: "Liveness probe — returns server status and version."
      security: []
      responses:
        "200":
          description: "Server is alive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/ready:
    get:
      tags: [health]
      summary: "Readiness probe — returns ok when the DB is writable."
      security: []
      responses:
        "200":
          description: "Server is ready."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: "Server not ready."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/hello:
    post:
      tags: [health]
      summary: "Protocol handshake — returns session metadata."
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                auth_method:
                  type: string
                vault:
                  type: string
                client:
                  type: string
      responses:
        "200":
          description: "Handshake acknowledged."
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_version:
                    type: string
                  session_id:
                    type: string
                  vault_id:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string

  /api/workers:
    get:
      tags: [health]
      summary: "Return worker pool stats (no auth required)."
      security: []
      responses:
        "200":
          description: "Worker stats."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineWorkerStats"

  /api/stats:
    get:
      tags: [health]
      summary: "Return database statistics."
      security:
        - BearerAuth: []
      parameters:
        - name: vault
          in: query
          schema:
            type: string
            default: "default"
      responses:
        "200":
          description: "DB statistics."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Engrams ───────────────────────────────────────────────────────────────

  /api/engrams:
    post:
      tags: [engrams]
      summary: "Write a new engram."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRequest"
      responses:
        "201":
          description: "Engram created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "421":
          $ref: "#/components/responses/NotCortex"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Idempotency key collision."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [engrams]
      summary: "List engrams for a vault (paginated)."
      security:
        - BearerAuth: []
      parameters:
        - name: vault
          in: query
          schema:
            type: string
            default: "default"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Paginated engram list."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEngramsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/engrams/batch:
    post:
      tags: [engrams]
      summary: "Batch-write multiple engrams atomically."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchWriteRequest"
      responses:
        "200":
          description: "Batch results (per-item success or error)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "421":
          $ref: "#/components/responses/NotCortex"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/engrams/{id}:
    get:
      tags: [engrams]
      summary: "Read a single engram by ID."
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: vault
          in: query
          schema:
            type: string
            default: "default"
      responses:
        "200":
          description: "Engram data."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [engrams]
      summary: "Soft-delete (forget) an engram."
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: vault
          in: query
          schema:
            type: string
            default: "default"
        - name: hard
