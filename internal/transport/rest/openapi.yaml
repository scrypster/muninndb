          description: "Cluster not enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/cluster/token/regenerate:
    post:
      tags: [cluster]
      summary: "Regenerate the cluster join token."
      security:
        - AdminSession: []
      responses:
        "200":
          description: "New join token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/cluster/enable:
    post:
      tags: [cluster]
      summary: "Persist cluster configuration on this node (restart required to activate)."
      description: >
        Saves cluster.yaml and returns 202 Accepted with restart_required=true.
        Clustering is NOT started in the running process: the storage layer's
        replication hook is wired when the store is built at boot, so a
        coordinator created afterwards would report itself enabled and replicate
        none of this node's writes. Restart muninn to activate clustering.
        Returns 200 with enabled=true only when clustering is already running,
        in which case the call is a no-op.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableClusterRequest"
      responses:
        "200":
          description: "Cluster was already running; no change."
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  role:
                    type: string
        "202":
          description: "Configuration saved. Restart this node to start clustering."
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: "Always false — configured, not running."
                  configured:
                    type: boolean
                  restart_required:
                    type: boolean
                  role:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

