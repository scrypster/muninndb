          description: "Reachability result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/cluster/nodes/{id}:
    delete:
      tags: [cluster]
      summary: "Remove a node from the cluster."
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: drain
