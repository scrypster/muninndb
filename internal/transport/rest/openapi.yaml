          description: "Cluster disabled."
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

