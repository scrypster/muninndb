name: Publish SDKs

# Triggers on version tag push OR manually from the Actions tab.
# NOTE: We use push→tags instead of release→published because GitHub's
# GITHUB_TOKEN events do not trigger downstream workflows.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build but don't upload)"
        required: false
        default: "false"

jobs:
  # ── Python SDK → PyPI ────────────────────────────────────────────────────
  publish-python:
    name: Build & publish muninn-python + muninndb
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    # PyPI trusts this job through publishers registered for this environment.
    environment:
      name: pypi-release
      url: https://pypi.org/p/muninn-python

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "SDK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          sed -i "s/version = \"0.0.0-dev\"/version = \"${VERSION}\"/" sdk/python/pyproject.toml
          sed -i "s/__version__ = \"0.0.0-dev\"/__version__ = \"${VERSION}\"/" sdk/python/muninn/__init__.py
          sed -i "s/version = \"0.0.0-dev\"/version = \"${VERSION}\"/" sdk/muninndb/pyproject.toml
          sed -i "s/__version__ = \"0.0.0-dev\"/__version__ = \"${VERSION}\"/" sdk/muninndb/muninndb/__init__.py
          sed -i "s/muninn-python>=0.2.0/muninn-python>=${VERSION}/" sdk/muninndb/pyproject.toml

      - name: Build muninn-python
        working-directory: sdk/python
        run: |
          rm -rf dist/
          python -m build

      - name: Build muninndb (alias stub)
        working-directory: sdk/muninndb
        run: |
          rm -rf dist/
          python -m build

      - name: Collect all artifacts
        run: |
          mkdir -p dist-all
          cp sdk/python/dist/* dist-all/
          cp sdk/muninndb/dist/* dist-all/
          ls -lh dist-all/

      - name: Publish to PyPI
        if: github.event.inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-all/
          skip-existing: true

      - name: Dry run — skip upload
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run complete. Packages built but not uploaded."

  # ── Node SDK → npm ────────────────────────────────────────────────────────
  # Requires: NPM_TOKEN secret (classic automation token from npmjs.com).
  # To set up: https://docs.npmjs.com/creating-and-viewing-access-tokens
  # Add to repo secrets as NPM_TOKEN with "Automation" token type.
  publish-node:
    name: Build & publish @muninndb/client to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"0.0.0-dev\"/\"version\": \"${VERSION}\"/" sdk/node/package.json

      - name: Install and build
        working-directory: sdk/node
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        working-directory: sdk/node
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not configured — skipping npm publish."
            echo "Add an npm Automation token to repo secrets as NPM_TOKEN to enable."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run — skip npm publish
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run — Node package built but not published."

  # ── PHP SDK → Packagist (via subtree split to muninndb-php repo) ─────────
  publish-php:
    name: Sync PHP SDK to muninndb-php
    runs-on: ubuntu-latest
    # The push to muninndb-php uses a short-lived token from the scrypster-ci
    # GitHub App, limited to that repository and to contents. The deploy key used
    # before is refused because the scrypster organization disables deploy keys.
    # This job's GITHUB_TOKEN only needs to read this repository.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Keep GITHUB_TOKEN out of the git config. Its stored header would be
          # sent with the push below in place of the app token.
          persist-credentials: false

      - name: Mint a token for muninndb-php
        id: php-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCRYPSTER_CI_APP_ID }}
          private-key: ${{ secrets.SCRYPSTER_CI_PRIVATE_KEY }}
          owner: scrypster
          repositories: muninndb-php
          permission-contents: write

      # Packagist reads composer.json at the root of a tagged commit, so the
      # release tag goes on the split commit, whose root is sdk/php. The tag used
      # to go on the monorepo commit, which has no composer.json at its root, and
      # Packagist listed no PHP SDK release after v0.2.3.
      - name: Split and push sdk/php to muninndb-php
        env:
          PHP_REPO_TOKEN: ${{ steps.php-token.outputs.token }}
        run: |
          SPLIT_SHA=$(git subtree split --prefix=sdk/php)
          REMOTE="https://x-access-token:${PHP_REPO_TOKEN}@github.com/scrypster/muninndb-php.git"
          git push "${REMOTE}" "${SPLIT_SHA}:refs/heads/main" --force
          git push "${REMOTE}" "${SPLIT_SHA}:refs/tags/${GITHUB_REF_NAME}" --force
